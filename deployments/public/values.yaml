# Public deployment values.
# Applied to cluster-01 (the instance that runs the Control Center).
# cluster-02 and cluster-03 pass --set controlCenter.enabled=false.
#
# PUBLIC_DEPLOYMENT=true disables password login and runtime manager
# in the control center — safe for public access.

runtime:
  image:
    tag: 0.7.17
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

gateway:
  image:
    tag: 0.7.17

controlCenter:
  replicaCount: 2
  image:
    tag: 0.7.17
  config:
    orkestraURLs:
      - http://orkestra-runtime.orkestra-system-01.svc.cluster.local:8080
      - http://orkestra-runtime.orkestra-system-02.svc.cluster.local:8080
      - http://orkestra-runtime.orkestra-system-03.svc.cluster.local:8080
      - http://orkestra-runtime.orkestra-system-04.svc.cluster.local:8080
      - http://orkestra-runtime.orkestra-system-05.svc.cluster.local:8080
      - http://orkestra-runtime.orkestra-system-06.svc.cluster.local:8080
  extraEnv:
    - name: PUBLIC_DEPLOYMENT
      value: "true"
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: cc.orkestra.sh
        paths:
          - path: /
            pathType: Prefix
