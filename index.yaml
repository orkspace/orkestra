  - annotations:
      artifacthub.io/changes: |
        - kind: added
          description: "early access release — first public build of Orkestra v0.7.0"
        - kind: added
          description: "e2e: wait: on import declarations, spec.customOperator, shared Orkestra across imports, ork e2e ./... discovery, --dry-run"
        - kind: added
          description: "advanced typed examples: 09-hooks, 10-constructor, 11-mixed-operator-pattern — now correctly embedded and extracted by ork init --pack advanced"
        - kind: added
          description: "ork init: restores go.mod and strips //go:build ignore from extracted typed example files"
        - kind: fixed
          description: "ork generate registry was always empty — enabledCRDs never seeded from merger; TypeRegistry iterated over nil"
        - kind: fixed
          description: "CustomHooksEnabled and ConstructorEnabled returned inverted logic (== nil instead of != nil)"
        - kind: fixed
          description: "crdFile, crFiles, setup.apply, and Komposer imports.files now resolve relative to the declaring file — ork run -f /abs/path works from any directory"
        - kind: fixed
          description: "go:embed skipped 09-hooks, 10-constructor, 11-mixed-operator-pattern — go.mod presence caused silent directory exclusion; fixed by renaming to go.mod.txt at embed time"
        - kind: changed
          description: "ork generate registry output: → / ✓ / ○ style; ensureMainGo only written when registry has content"
        - kind: changed
          description: "use-cases/full-stack-app: all six sub-katalogs switched to crdFile: — manual kubectl apply CRD pre-step eliminated"
        - kind: added
          description: "deployments/public/: six-cluster public demo — 6 runtimes, 75 CRDs, 1 Control Center"
        - kind: added
          description: "webhook housekeeper: namespace labels and CRD conversion caBundle now reconciled continuously — previously applied once at startup, now watched and restored on drift"
        - kind: added
          description: "schema docs: Katalog index.md landing page; 01-katalog.md renamed to 01-top-level.md; admonitions on all four kind pages (Motif, Katalog, Komposer, E2E)"
        - kind: added
          description: "blog: 04-why-i-built-this.md — origin story and naming etymology"
        - kind: fixed
          description: "CRD health oscillation — LastReconcile() side effect and SetStarted() resync reset removed"
        - kind: fixed
          description: "crdExists() now distinguishes transient network errors from genuine CRD absence"
        - kind: fixed
          description: "postStartRetryInterval restored from 3s (debug) to 90s with 5-minute capped backoff"
        - kind: fixed
          description: "ClusterRole/ClusterRoleBinding names scoped to orkestra-<namespace> — no more last-write-wins collision"
        - kind: fixed
          description: "Docker builds write to /tmp/ instead of ~/.orkestra/bin/ — dev CLI no longer overwritten"
        - kind: fixed
          description: "once: true documentation corrected — check-before-generate semantics, not drift suppression"
        - kind: changed
          description: "Memory baseline updated to 79 MB RSS — measured from a live 10-CRD runtime"
        - kind: changed
          description: "publication 03 (the-function-that-waited) moved to private docs — two publications ship for v1"
      artifacthub.io/crds: |
        - kind: Katalog
          version: v1
          name: katalogs.orkestra.orkspace.io
          displayName: Katalog
          description: Declarative operator definition for one or more CRDs
        - kind: Komposer
          version: v1
          name: komposers.orkestra.orkspace.io
          displayName: Komposer
          description: Compose multiple Katalogs from different sources
        - kind: Motif
          version: v1
          name: motifs.orkestra.orkspace.io
          displayName: Motif
          description: A parameterized set of resource declarations. Write once, import from any Katalog.
        - kind: E2E
          version: v1
          name: e2es.orkestra.orkspace.io
          displayName: E2E
          description: Declarative end-to-end testing for Kubernetes operators
      artifacthub.io/crdsExamples: |
        - apiVersion: orkestra.orkspace.io/v1
          kind: Katalog
          metadata:
            name: hello-website
          spec:
            crds:
              website:
                crdFile: ./crd.yaml
                crFiles:
                  - ./cr.yaml
                operatorBox:
                  default: true
                  onCreate:
                    deployments:
                      - name: "{{ .metadata.name }}"
                        image: "{{ .spec.image }}"
                        replicas: "{{ .spec.replicas }}"
                        reconcile: true
                    services:
                      - name: "{{ .metadata.name }}-svc"
                        port: "80"
                        targetPort: "{{ .spec.port }}"
                        reconcile: true
        - apiVersion: orkestra.orkspace.io/v1
          kind: Komposer
          metadata:
            name: platform
          imports:
            registry:
              - url: ghcr.io/orkspace/patterns/postgres@v1.0.0
                oci: true
            files:
              - ./website-katalog.yaml
          spec:
            crds:
              postgres:
                workers: 8
                resync: 30s
              website:
                workers: 6
                resync: 15s
        - apiVersion: orkestra.orkspace.io/v1
          kind: Motif
          metadata:
            name: postgres
            version: v0.1.0
            description: PostgreSQL StatefulSet with persistent storage and pgAdmin UI.
            author: orkspace
            license: Apache-2.0
            tags:
              - database
              - statefulset
          inputs:
            - name: image
              default: "postgres:latest"
            - name: replicas
              default: "1"
            - name: volumeSize
              default: "10Gi"
          resources:
            onCreate:
              secrets:
                - name: "{{ .metadata.name }}-creds"
                  once: true
                  data:
                    password: "{{ randomAlphanumeric 16 }}"
            statefulSets:
              - name: "{{ .metadata.name }}-postgres"
                image: "{{ .inputs.image }}"
                replicas: "{{ .inputs.replicas }}"
                volumeClaimTemplates:
                  - name: data
                    storageSize: "{{ .inputs.volumeSize }}"
                    mountPath: /var/lib/postgresql/data
            services:
              - name: "{{ .metadata.name }}-postgres"
                port: 5432
          status:
            fields:
              - path: postgresReady
                value: "{{ allReplicasReady .children.statefulset }}"
              - path: connectionString
                value: "postgresql://{{ .metadata.name }}-postgres.{{ .metadata.namespace }}.svc.cluster.local:5432"
        - apiVersion: orkestra.orkspace.io/v1
          kind: E2E
          metadata:
            name: hello-website-e2e
          spec:
            katalog: ./katalog.yaml
            crd: ./crd.yaml
            cr: ./cr.yaml
            cluster:
              provider: kind
              name: ork-e2e
            expect:
              - name: Deployment created
                after: cr-applied
                timeout: 60s
                resources:
                  - kind: Deployment
                    namespace: default
                    ready: true
      artifacthub.io/images: |
        - name: runtime
          image: ghcr.io/orkspace/orkestra
        - name: gateway
          image: ghcr.io/orkspace/orkestra-gateway
        - name: control-center
          image: ghcr.io/orkspace/orkestra-cc
      artifacthub.io/license: Apache-2.0
      artifacthub.io/links: |
        - name: Documentation
          url: https://orkestra.sh
        - name: Why Orkestra?
          url: https://orkestra.sh/blog/why-orkestra
        - name: Control Center Dashboard
          url: https://cc.orkestra.sh
        - name: Orkestra Registry
          url: https://orkestra.sh/docs/reference/orkestra-registry
