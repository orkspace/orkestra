    maintainers:
    - email: releases@orkspace.io
      name: Orkspace
      url: https://github.com/orkspace/orkestra
    name: orkestra
    sources:
    - https://github.com/orkspace/orkestra
    type: application
    urls:
    - https://orkspace.github.io/orkestra/orkestra-0.7.8.tgz
    version: 0.7.8
  - annotations:
      artifacthub.io/changes: |
        - kind: added
          description: "registry-guide pack — 13-step walkthrough from consuming a pattern to automated CI publishing with GitHub Actions"
        - kind: added
          description: "ork push: --use-current and --cluster flags to reuse an existing cluster for the e2e gate"
        - kind: added
          description: "ork push: RuntimeVersion read from go.mod for typed operators and recorded as OCI annotation"
        - kind: added
          description: "ork pull: warns on runtime version mismatch for typed operators"
        - kind: added
          description: "ork inspect: shows Typed and Runtime fields for typed patterns"
        - kind: added
          description: "ork validate / ork simulate: TypedOperatorError with ork inspect hint for registry-sourced typed operators"
        - kind: added
          description: "dev server: /ready and /started health endpoints"
        - kind: fixed
          description: "probe path templates ({{ .spec.probePath }}) now resolve correctly in Deployment, ReplicaSet, StatefulSet, and Pod specs"
        - kind: fixed
          description: "Deployment no longer triggers a no-op update every reconcile when an HTTP probe is configured (missing Scheme on HTTPGetAction)"
        - kind: fixed
          description: "Helm bundle deploy correctly routes CRDs to their declared metadata.namespace — each team sees their own namespace panel in the Control Center"
        - kind: fixed
          description: "ork inspect --versions table columns align correctly when version strings are colorized"
        - kind: fixed
          description: "ork inspect --versions works without a version tag in the argument"
        - kind: fixed
          description: "deprecated pattern row aligns correctly in ork patterns — warning marker moved to its own column"
        - kind: fixed
          description: "deprecation message shown even when no migration target is set"
        - kind: fixed
          description: "Control Center version labels no longer double the v prefix"
        - kind: fixed
          description: "Control Center katalog panel shows namespace-level description when a namespace filter is active"
      artifacthub.io/crds: |
        - kind: Katalog
          version: v1
          name: katalogs.orkestra.orkspace.io
          displayName: Katalog
          description: Declarative operator definition for one or more CRDs
        - kind: Komposer
          version: v1
          name: komposers.orkestra.orkspace.io
          displayName: Komposer
          description: Compose multiple Katalogs from different sources
        - kind: Motif
          version: v1
          name: motifs.orkestra.orkspace.io
          displayName: Motif
          description: A parameterized set of resource declarations. Write once, import from any Katalog.
        - kind: E2E
          version: v1
          name: e2es.orkestra.orkspace.io
          displayName: E2E
          description: Declarative end-to-end testing for Kubernetes operators
      artifacthub.io/crdsExamples: |
        - apiVersion: orkestra.orkspace.io/v1
          kind: Katalog
          metadata:
            name: hello-website
          spec:
            crds:
              website:
                crdFile: ./crd.yaml
                crFiles:
                  - ./cr.yaml
                operatorBox:
                  default: true
                  onCreate:
                    deployments:
                      - name: "{{ .metadata.name }}"
                        image: "{{ .spec.image }}"
                        replicas: "{{ .spec.replicas }}"
                        reconcile: true
                    services:
                      - name: "{{ .metadata.name }}-svc"
                        port: "80"
                        targetPort: "{{ .spec.port }}"
                        reconcile: true
        - apiVersion: orkestra.orkspace.io/v1
          kind: Komposer
          metadata:
            name: platform
          imports:
            registry:
              - url: ghcr.io/orkspace/patterns/postgres@v1.0.0
                oci: true
            files:
              - ./website-katalog.yaml
          spec:
            crds:
              postgres:
                workers: 8
                resync: 30s
              website:
                workers: 6
                resync: 15s
        - apiVersion: orkestra.orkspace.io/v1
          kind: Motif
          metadata:
            name: postgres
            version: v0.1.0
            description: PostgreSQL StatefulSet with persistent storage and pgAdmin UI.
            author: orkspace
            license: Apache-2.0
            tags:
              - database
              - statefulset
          inputs:
            - name: image
              default: "postgres:latest"
            - name: replicas
              default: "1"
            - name: volumeSize
              default: "10Gi"
          resources:
            onCreate:
              secrets:
                - name: "{{ .metadata.name }}-creds"
                  once: true
                  data:
                    password: "{{ randomAlphanumeric 16 }}"
            statefulSets:
              - name: "{{ .metadata.name }}-postgres"
                image: "{{ .inputs.image }}"
                replicas: "{{ .inputs.replicas }}"
                volumeClaimTemplates:
                  - name: data
                    storageSize: "{{ .inputs.volumeSize }}"
                    mountPath: /var/lib/postgresql/data
            services:
              - name: "{{ .metadata.name }}-postgres"
                port: 5432
          status:
            fields:
              - path: postgresReady
                value: "{{ allReplicasReady .children.statefulset }}"
              - path: connectionString
                value: "postgresql://{{ .metadata.name }}-postgres.{{ .metadata.namespace }}.svc.cluster.local:5432"
        - apiVersion: orkestra.orkspace.io/v1
          kind: E2E
          metadata:
            name: hello-website-e2e
          spec:
            katalog: ./katalog.yaml
            crd: ./crd.yaml
            cr: ./cr.yaml
            cluster:
              provider: kind
              name: ork-e2e
            expect:
              - name: Deployment created
                after: cr-applied
                timeout: 60s
                resources:
                  - kind: Deployment
                    namespace: default
                    ready: true
      artifacthub.io/images: |
        - name: runtime
          image: ghcr.io/orkspace/orkestra
        - name: gateway
          image: ghcr.io/orkspace/orkestra-gateway
        - name: control-center
          image: ghcr.io/orkspace/orkestra-cc
      artifacthub.io/license: Apache-2.0
      artifacthub.io/links: |
        - name: Documentation
          url: https://orkestra.sh
        - name: Why Orkestra?
          url: https://orkestra.sh/blog/why-orkestra
        - name: Control Center Dashboard
          url: https://cc.orkestra.sh
        - name: Orkestra Registry
          url: https://orkestra.sh/docs/reference/orkestra-registry
      artifacthub.io/operator: "true"
      artifacthub.io/operatorCapabilities: Deep Insights
      artifacthub.io/screenshots: |
        - title: Orkestra Control Center
          url: https://raw.githubusercontent.com/orkspace/orkestra/main/documentation/assets/controlcenter/control-center-landing.png
        - title: CRD Health View
          url: https://raw.githubusercontent.com/orkspace/orkestra/main/documentation/assets/controlcenter/control-panel-website.png
        - title: Metrics Overview
          url: https://raw.githubusercontent.com/orkspace/orkestra/main/documentation/assets/controlcenter/pv-watcher-workers.png
