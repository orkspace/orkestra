apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: watch-probe
  author: orkspace
  version: 0.1.0
  description: >
    Living fixture for operatorBox.observe.watch. A WatchProbe CR watches a shared
    ConfigMap it does not own. When the ConfigMap changes, the WatchProbe is
    re-enqueued and reconciles — no ownerReference required. Key resolution
    uses keyFrom.name (singleton pattern).

spec:
  crds:
    watch-probe:
      labels:
        watchprobe-tester: "{{ .metadata.name }}"
      crdFile: crd.yaml
      crFiles:
        - cr.yaml
      setup:
        - configmap-shared.yaml
      operatorBox:
        reconciler:
          resync: 30s
        watch:
          - apiVersion: v1
            kind: ConfigMap
            name: shared-config
            namespace: default
            on: [update]
            keyFrom:
              name: probe-alpha
              namespace: default

        onReconcile:
          configMaps:
            - name: "{{ .metadata.name }}-output"
              namespace: "{{ .metadata.namespace }}"
              reconcile: true
              data:
                observed: "{{ .metadata.name }}"
                phase: active

        status:
          fields:
            - path: phase
              value: Watching
