apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: watch-entries
  version: 0.1.0
  description: Valid operatorBox.observe.watch and preReconcile.sentinels.
spec:
  crds:
    widget:
      crdFile: ../crd.yaml
      operatorBox:
        preReconcile:
          sentinels:
            - generationChanged
            - labelsChanged
        watch:
          - apiVersion: apps/v1
            kind: Deployment
          - apiVersion: v1
            kind: Node
            on: [update]
