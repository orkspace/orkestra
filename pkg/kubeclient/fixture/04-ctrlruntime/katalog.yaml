apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: webapp-ctrlruntime
  author: orkspace
  version: 0.1.0
  description: >
    WebApp operator — reconciler written in controller-runtime style.
    The constructor wraps it with domain.ReconcilerFrom and orkadapter.ToClient
    so it plugs into Orkestra without rewriting the reconciler body.

spec:
  crds:
    webapp:
      crdFile: ./crd-webapp.yaml
      crFiles:
        - ./cr-webapp.yaml

      apiTypes:
        group: migration.demo.orkestra.io
        version: v1alpha1
        kind: WebApp
        plural: webapps
        object: WebApp
        objectList: WebAppList
        location: github.com/orkspace/orkestra-ctrlruntime-constructor/api/v1alpha1
        alias: webappv1

      operatorBox:
        watch:
          - apiVersion: v1
            kind: ConfigMap
            index:
              - name: metadata.labels.app
                field: "metadata.labels.app"

        preReconcile:
          reconcileGate:
            eventAware: true
        reconciler:
          default: false
          constructor:
            location: github.com/orkspace/orkestra-ctrlruntime-constructor/constructor
            function: NewWebAppReconciler
            alias: webappconstructor
            managedResources:
              - kind: Deployment
          workers: 2
          resync: 30s
