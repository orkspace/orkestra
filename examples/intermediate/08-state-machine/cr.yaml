apiVersion: demo.orkestra.io/v1alpha1
kind: Pipeline
metadata:
  name: build-and-test
  namespace: default
spec:
  image: alpine:3.19
  steps:
    - name: build
      command: "echo Building... done"

    - name: test
      command: "echo Testing... passed"

    - name: notify
      command: "echo Pipeline complete"
---
# A pipeline that will fail — tests the Failed terminal state
apiVersion: demo.orkestra.io/v1alpha1
kind: Pipeline
metadata:
  name: failing-pipeline
  namespace: default
spec:
  image: alpine:3.19
  steps:
    - name: build
      command: "echo 'Build failing' && exit 1"

    - name: test
      command: "echo This should not run"

    - name: notify
      command: "echo This should not run either"
