apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: pipeline-operator
  author: orkspace
  version: 0.1.0
  description: >
    Declarative state machine — Pending → Running/build → Running/test
    → Running/notify → Succeeded | Failed.
    No Go. No constructor. No hooks. Pure YAML.
    Run with: ork run --file katalog.yaml

spec:
  crds:
    pipeline:
      crdFile: ./crd.yaml
      # ── Validation ───────────────────────────────────────────────────
      admission:
        validation:
          rules:
            - field: spec.image
              operator: exists
              message: "spec.image is required"
              action: deny
            - field: spec.steps
              operator: exists
              message: "spec.steps is required"
              action: deny
      operatorBox:
        reconcile:
          workers: 4
          resync: 10s   # short resync to check Job completion quickly
          queue:
            maxDepth: 1000
          onReconcile:
            jobs:
              # ── Step 1: build ───────────────────────────────────────────
              # Created when phase is empty (first reconcile)
              - name: "{{ .metadata.name }}-build"
                image: "{{ .spec.image }}"
                command: ["sh", "-c", "{{ index (index .spec.steps 0) \"command\" }}"]
                when:
                  - field: status.phase
                    operator: notExists
                reconcile: false   # create once — Job is terminal

              # ── Step 2: test ────────────────────────────────────────────
              # Gate on status.phase only — children.* is not available during
              # resource evaluation; phase already encodes that build succeeded.
              - name: "{{ .metadata.name }}-test"
                image: "{{ .spec.image }}"
                command: ["sh", "-c", "{{ index (index .spec.steps 1) \"command\" }}"]
                when:
                  - field: status.phase
                    equals: "Running/test"

              # ── Step 3: notify ──────────────────────────────────────────
              # Created when test Job succeeded
              - name: "{{ .metadata.name }}-notify"
                image: "{{ .spec.image }}"
                command: ["sh", "-c", "{{ index (index .spec.steps 2) \"command\" }}"]
                when:
                  - field: status.phase
                    equals: "Running/notify"
        emit:
          status:
            fields:
              # ── Initial state ───────────────────────────────────────────
              - path: phase
                value: "Pending"
                when:
                  - field: status.phase
                    operator: notExists

              # ── Build started ───────────────────────────────────────────
              - path: phase
                value: "Running/build"
                when:
                  - field: status.phase
                    operator: in
                    value: "Pending,"       # Pending or empty

              - path: currentStep
                value: "build"
                when:
                  - field: status.phase
                    operator: in
                    value: "Pending,Running/build,"

              # ── Test started ────────────────────────────────────────────
              - path: phase
                value: "Running/test"
                when:
                  - field: status.phase
                    equals: "Running/build"
                  - field: children.job.status.succeeded
                    greaterThan: "0"

              - path: currentStep
                value: "test"
                when:
                  - field: status.phase
                    equals: "Running/test"

              # ── Notify started ──────────────────────────────────────────
              - path: phase
                value: "Running/notify"
                when:
                  - field: status.phase
                    equals: "Running/test"
                  - field: children.job.status.succeeded
                    greaterThan: "0"

              - path: currentStep
                value: "notify"
                when:
                  - field: status.phase
                    equals: "Running/notify"

              # ── Succeeded — declared last, overrides any Running state ──
              - path: phase
                value: "Succeeded"
                when:
                  - field: status.phase
                    equals: "Running/notify"
                  - field: children.job.status.succeeded
                    greaterThan: "0"

              - path: currentStep
                value: ""
                when:
                  - field: status.phase
                    equals: "Succeeded"

              # ── Failed — checked at every reconcile ─────────────────────
              # Any Job failure drives to Failed regardless of current phase
              - path: phase
                value: "Failed"
                when:
                  - field: children.job.status.failed
                    greaterThan: "0"

              - path: currentStep
                value: ""
                when:
                  - field: status.phase
                    equals: "Failed"

              # ── Always-written fields ────────────────────────────────────
              # No when: → written on every successful reconcile
              - path: image
                value: "{{ .spec.image }}"
        # Terminal states (Succeeded, Failed) are declared last
        # so they override Running states when conditions are met.

