apiVersion: orkestra.orkspace.io/v1
kind: Motif
metadata:
  name: pipeline-resources
  description: Creates Jobs for build, test, and notify phases.
inputs: []   # no inputs – uses CR spec directly
resources:
  jobs:
    - name: "{{ .metadata.name }}-build"
      image: "{{ .spec.image }}"
      command: ["sh", "-c", "{{ index (index .spec.steps 0) \"command\" }}"]
      when:
        - field: status.phase
          operator: notExists
      reconcile: false

    - name: "{{ .metadata.name }}-test"
      image: "{{ .spec.image }}"
      command: ["sh", "-c", "{{ index (index .spec.steps 1) \"command\" }}"]
      when:
        - field: status.phase
          equals: "Running/test"

    - name: "{{ .metadata.name }}-notify"
      image: "{{ .spec.image }}"
      command: ["sh", "-c", "{{ index (index .spec.steps 2) \"command\" }}"]
      when:
        - field: status.phase
          equals: "Running/notify"