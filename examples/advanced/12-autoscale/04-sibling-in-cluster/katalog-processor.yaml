apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: processor-autoscale-sibling-in-cluster
  author: orkspace
  version: 0.1.0
  description: >
    Cross-binary autoscaling within the same cluster.

    Processor autoscales based on Loader's live queue depth — but because
    they are in different processes, Processor uses source.endpoint to fetch
    the metric from Loader's Orkestra REST API instead of reading the
    informer cache directly.

    Responses are cached for 10s to avoid hammering on every evaluation
    interval. The autoscale interval is 20s, so each evaluation reads a
    cached value at most twice stale — acceptable for burst-response scaling.

spec:
  crds:
    # ── Processor (processor-system deployment) ───────────────────────────────
    # Autoscales based on Loader's queue depth fetched via HTTP API.
    # source.endpoint is required because Loader is in a different process.
    processor:
      apiTypes:
        group: autoscale.orkestra.io
        version: v1alpha1
        kind: Processor
        plural: processors


      operatorBox:
        reconciler:
          workers: 2
          resync: 30s
        cross:
          # Monitors a particular Loader CR called 'my-loader'
          - crd: loader
            selector:
              name: my-loader
              namespace: default
            source:
              host: "http://localhost:8080"
              protocol: cr

              # Or replace host and type with endpoint
              # endpoint: "http://localhost:8080/katalog/loader/cr/default/my-loader"
            as: loaderCRInfo

          # Monitor the operator health and itself
          - crd: loader
            source:
              host: "http://localhost:8080"
              protocol: health
              cacheFor: 30s

              # Or replace host and type with endpoint
              # endpoint: "http://localhost:8080/katalog/loader/health"
            as: loaderHealth

          - crd: loader
            source:
              host: "http://localhost:8080"
              protocol: metrics
              cacheFor: 30s
            as: loaderCRDInfo

        autoscale:
          interval: 20s
          cooldown: 3m
          conditions:
            when:
              - field: cross.loader.metrics.queueDepth
                greaterThan: "60"
          do:
            workers: 8
            queueDepth: 800
            resync: 10s

        status:
          fields:
            - path: phase
              value: "Running"
            - path: autoscaleActive
              value: "{{ .metrics.autoscaleActive }}"
            - path: workers
              value: "{{ .metrics.workers }}"
            - path: lastError
              value: "{{ .health.lastError }}"
            - path: state
              value: "{{ .health.state }}"
            - path: loaderQueueDepth
              value: "{{ .cross.loaderCRDInfo.metrics.queueDepth }}"
            - path: queueDepth
              value: "{{ .metrics.queueDepth }}"
            - path: loaderState
              value: "{{ .cross.loaderCRInfo.status.phase }}"
            - path: loaderHealthy
              value: "{{ .cross.loaderHealth.healthy }}"
            - path: loaderLastError
              value: "{{ .cross.loaderHealth.lastError }}"
            - path: loaderPhase
              value: "{{ .cross.loaderHealth.state }}"
            - path: loaderDeploymentReady
              value: "{{ .cross.loaderCRInfo.children.deployment.ready }}"

        onCreate:
          deployments:
            - image: "{{ .spec.image }}"
              replicas: "{{ .spec.replicas }}"
              port: 9090
              reconcile: true
          services:
            - port: "9090"
